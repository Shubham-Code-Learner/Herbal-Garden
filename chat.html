<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div id="chat-container">
        <h1 style="color: white; text-align: center;">Medicinal Plant Chatbot</h1>
        <div id="chat-output"></div>
        
        <!-- Voice button -->
        <button id="mic-btn" style="font-weight: bold;">🎤 Speak</button>
        
        <!-- Text input for typing -->
        <input type="text" id="text-input" placeholder="Type your message..." />
        <button id="send-btn" style="font-weight: bold;">Send</button>

        <!-- Loading spinner -->
        <div id="loading" class="loading-spinner" style="display: none;"></div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
