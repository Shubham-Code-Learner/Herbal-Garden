<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Navigation */
        .nav {
            padding: 2rem;
            display: flex;
            gap: 2rem;
            position: relative;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            position: relative;
            padding: 0.5rem 1rem;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #00ff88;
            transform: translateY(-3px);
        }

        .nav a.active {
            color: #00ff88;
        }

        .nav-indicator {
            position: absolute;
            height: 2px;
            background: #00ff88;
            bottom: 1.5rem;
            transition: 0.3s;
        }

        /* Page Sections */
        .page {
            min-height: 100vh;
            padding: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s;
            position: absolute;
            width: 100%;
            display: none;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        /* Contact Form */
        .contact-form {
            max-width: 600px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .form-group label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            pointer-events: none;
            transition: 0.3s;
            color: #888;
        }

        .form-group input:focus ~ label,
        .form-group input:valid ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:valid ~ label {
            transform: translateY(-1.5rem);
            font-size: 0.8rem;
            color: #00ff88;
        }

        button {
            background: #00ff88;
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        /* About Section */
        .about-content {
            max-width: 800px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .team-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .team-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }

        .social-links {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .social-links a {
            color: #fff;
            font-size: 1.5rem;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: #00ff88;
            transform: scale(1.2);
        }

        /* Floating Shapes */
        .floating-shape {
            position: fixed;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 50%;
            filter: blur(30px);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, 100px) rotate(90deg); }
            50% { transform: translate(-50px, 150px) rotate(180deg); }
            75% { transform: translate(-100px, 50px) rotate(270deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    
    <div class="nav">
        <a href="#home" class="active">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <div class="nav-indicator"></div>
    </div>

    <div id="home" class="page active">
        <div class="floating-shape" style="width: 300px; height: 300px; top: 20%; left: 10%;"></div>
        <div class="floating-shape" style="width: 200px; height: 200px; top: 60%; right: 15%; animation-delay: -5s;"></div>
    </div>

    <div id="about" class="page">
        <div class="about-content">
            <h2>About Us</h2>
            <p>We are a passionate team dedicated to creating amazing digital experiences.</p>
            <div class="team-cards">
                <div class="team-card">
                    <h3>Shubham Soni</h3>
                    <p>CEO & Founder</p>
                    <div class="social-links">
                        <a href="#">🌐</a>
                        <a href="#">📘</a>
                        <a href="#">📱</a>
                    </div>
                </div>
                <div class="team-card">
                    <h3>Jane Smith</h3>
                    <p>Lead Designer</p>
                    <div class="social-links">
                        <a href="#">🌐</a>
                        <a href="#">📘</a>
                        <a href="#">📱</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="contact" class="page">
        <form class="contact-form">
            <div class="form-group">
                <input type="text" required>
                <label>Name</label>
            </div>
            <div class="form-group">
                <input type="email" required>
                <label>Email</label>
            </div>
            <div class="form-group">
                <textarea rows="5" required></textarea>
                <label>Message</label>
            </div>
            <button type="submit">Send Message 🚀</button>
        </form>
    </div>

    <script>
        // Animated Background
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
                this.velocity = Math.random() * 2 + 1;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += 0.02;
                this.x += Math.cos(this.angle) * this.velocity;
                this.y += Math.sin(this.angle) * this.velocity;
                
                if (this.x < 0 || this.x > canvas.width || 
                    this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(0, 255, 136, ${this.size/2})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 100 }, () => new Particle());

        function animate() {
            ctx.fillStyle = 'rgba(15, 15, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        animate();

        // Page Navigation
        const pages = document.querySelectorAll('.page');
        const navLinks = document.querySelectorAll('.nav a');
        const indicator = document.querySelector('.nav-indicator');

        function setActivePage(target) {
            pages.forEach(page => page.classList.remove('active'));
            document.querySelector(target).classList.add('active');
            
            navLinks.forEach(link => link.classList.remove('active'));
            document.querySelector(`[href="${target}"]`).classList.add('active');
            
            // Move indicator
            const activeLink = document.querySelector('.nav a.active');
            indicator.style.width = `${activeLink.offsetWidth}px`;
            indicator.style.left = `${activeLink.offsetLeft}px`;
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                setActivePage(link.getAttribute('href'));
            });
        });

        // Form Submission
        document.querySelector('.contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Message sent successfully!');
            e.target.reset();
        });

        // Initial setup
        setActivePage('#home');
    </script>
</body>
</html>
